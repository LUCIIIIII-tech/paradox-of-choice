<!doctype html>
<html lang="tl" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Finishing pass for Gising Ka Habang Inooperahan: the three.js render (assets/video.mp4) + the mix (assets/mix.wav),
         with a soft film grain and vignette on top. sync.py copies the assets in and sets every duration from ../timeline.json.
         Preview: npm run dev (scrub, check sync, tweak). The delivery MP4 still comes from ../build.sh (loudnorm, size, flash check). -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root { --ground: #000; --ink: #f4f1ea; --ember: #ff5a3c; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; }
      #film { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #vignette { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 75% 60% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
      #grain { position: absolute; inset: -10%; pointer-events: none; opacity: .07; mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="88.4" data-width="1080" data-height="1920">
      <video id="film" class="clip" src="assets/video.mp4" muted playsinline data-start="0" data-duration="88.4" data-track-index="0"></video>
      <audio id="mix" class="clip" src="assets/mix.wav" data-start="0" data-duration="88.4" data-track-index="1"></audio>
      <div id="vignette" class="clip" data-start="0" data-duration="88.4" data-track-index="2"></div>
      <div id="grain" class="clip" data-start="0" data-duration="88.4" data-track-index="3"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // the grain drifts in small seeded steps (no strobe: opacity stays fixed, only the position moves)
      for (let i = 0; i < 88; i++) tl.set("#grain", { x: ((i * 37) % 23) - 11, y: ((i * 53) % 19) - 9 }, i);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
